[project]
name = "locust-test"
version = "0.1.0"
description = ""
authors = [
    {name = "turgor",email = "maxac153@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Основные зависимости Locust + gRPC
    "locust (>=2.43.1,<3.0.0)",
    "grpcio (>=1.76.0,<2.0.0)",
    "grpcio-tools (>=1.76.0,<2.0.0)",
    "protobuf (>=6.33.4,<7.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    "aiohttp (>=3.10.0,<4.0.0)",
    "websocket-client (>=1.8.0,<2.0.0)",
    "orjson (>=3.10.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "faker (>=38.2.0,<39.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "kafka-python (>=2.3.0,<3.0.0)"
]
